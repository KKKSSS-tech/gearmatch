version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      frontend-tooling:
        patterns:
          - "@vitejs/*"
          - "vite"
          - "eslint*"
          - "vitest"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
